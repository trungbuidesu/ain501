# Single application config: capture, models, detector, tier1, RAG, UI, hotkeys.
# Default: python -m src.app  (uses this file)

capture_config: configs/capture_pipeline.yaml

models:
  yolo_int8: models/yolov8n.onnx
  mobilenet_fp32: models/mobilenetv3_small_fp32.onnx
  piper_model_path: models/tts/piper/vi/vi_VN/vais1000/medium/vi_VN-vais1000-medium.onnx

encoder:
  enabled: true

detector:
  conf_threshold: 0.5
  iou_threshold: 0.45
  max_detections: 100
  allowed_labels:
    - person
    - dog
    - car
    - truck
    - bus
    - motorcycle
    - bicycle
    - traffic_light
    - stop_sign
    - bench
    - chair

caption:
  empty_policy: silent

output:
  reports_dir: reports/app
  dedup_window_s: 2.5
  debug_overlay: false

tier1:
  enabled: true
  strict_artifacts: true
  object_only: false
  action_enabled: true
  ring_buffer_maxlen: 48
  action_clip_frames: 16
  movinet_int8: models/movinet_a0_int8.onnx
  ocr_confidence: 0.5
  ocr_grid: 2
  mediapipe_model_dir: reports/prebuilt_week5/_mediapipe_models
  router:
    model_path: models/scene_classifier_int8.onnx
    confidence_threshold: 0.45
    image_size: 160
    scene_to_agents:
      static: [object]
      motion: [object, action]
      text_present: [object, ocr]
      face_detected: [object, face_pose]
      scene_change: [object, action]
    fallback:
      motion_diff_threshold: 8.0
      edge_density_threshold: 0.08
      skin_ratio_threshold: 0.12
      motion_diff_scene_change: 18.0
  timeouts:
    object_s: 2.0
    action_s: 2.0
    ocr_s: 5.0
    face_pose_s: 3.0

rag:
  model_path: models/minilm_l6.onnx
  knowledge_dir: data/knowledge
  top_k: 3
  min_similarity: 0.3
  dedup_similarity: 0.8
  enabled: true

ui:
  enabled: false
  window_width: 960
  window_height: 720
  show_fps: true
  show_detections: true
  show_caption: true
  show_dashboard: true
  screenshot_dir: screenshots/

verbosity: medium

hotkeys:
  toggle: ctrl+shift+s
  describe_now: ctrl+shift+d
  read_text: ctrl+shift+t
  mute: ctrl+shift+m
