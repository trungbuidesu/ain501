# Webcam capture (default index 0). Use with:
#   python -m src.app --capture-config configs/capture_webcam.yaml

source:
  type: webcam
  webcam_index: 0
  file_path: null
  file_loop: false

screen:
  backend: auto
  region: null
  select_region_on_start: false

timing:
  target_fps: 8.0
  buffer_size: 30

change_detection:
  method: ssim
  ssim_trigger_below: 0.92
  changed_fraction_trigger_above: 0.02
  pixel_diff_threshold: 25
  max_metric_side: 320
