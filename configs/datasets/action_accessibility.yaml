name: action_accessibility
task: action_recognition
phase: "0.4"
base_dataset:
  name: hmdb51
  homepage: http://serre-lab.clps.brown.edu/resource/hmdb-a-large-human-motion-database/
  root: data/processed/action_accessibility
  videos_root: data/processed/action_accessibility/videos
classes:
  hmdb51_accessibility:
    - walk
    - wave
    - sit
    - stand
    - climb_stairs
    - fall_floor
    - run
    - turn
    - push
    - shake_hands
    - talk
    - clap
sampling:
  frame_sequence_length: 16
  frame_stride: 2
  split_seed: 501
  split_strategy: stratified_80_20_custom
output:
  manifest: data/processed/action_accessibility/manifest.csv
  split_manifest: data/processed/action_accessibility/manifest_frames.csv
