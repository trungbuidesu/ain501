name: action_accessibility
task: action_recognition
phase: "0.4"
base_dataset:
  name: ucf101
  homepage: https://www.crcv.ucf.edu/data/UCF101.php
  root: data/external/ucf101
  split_root: data/external/ucf101/ucfTrainTestlist
  videos_root: data/external/ucf101/UCF-101
  download:
    dry_run_default: true
    manual_note: UCF-101 is downloaded from the official dataset page; place videos under UCF-101 and official train/test lists under ucfTrainTestlist.
classes:
  public_bootstrap:
    - BabyCrawling
    - BalanceBeam
    - Basketball
    - BenchPress
    - Biking
    - BodyWeightSquats
    - BoxingPunchingBag
    - BoxingSpeedBag
    - Clapping
    - HorseRiding
    - JumpingJack
    - PullUps
    - PushUps
    - RockClimbingIndoor
    - RopeClimbing
    - SkateBoarding
    - SoccerJuggling
    - TaiChi
    - WalkingWithDog
    - WallPushups
  custom_required:
    - person_approaching
    - vehicle_approaching
    - pointing_direction
    - open_door
    - close_door
    - crossing_street
    - stairs_up
    - stairs_down
phase_notes:
  approaching: Derived from object detection plus tracking in Phase 9; not a Phase 0 blocker.
sampling:
  frame_sequence_length: 16
  frame_stride: 2
  split_seed: 501
output:
  manifest: data/processed/action_accessibility/manifest.csv
  split_manifest: data/processed/action_accessibility/splits.csv
