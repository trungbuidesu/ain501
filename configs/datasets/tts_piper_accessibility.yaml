name: tts_piper_accessibility
task: tts_validation
phase: "0.8"
engine:
  name: piper
  repository: https://github.com/OHF-Voice/piper1-gpl
  voices_repository: https://huggingface.co/rhasspy/piper-voices
  install_extra: ".[tts]"
paths:
  voices_root: models/tts/piper
  validation_output: data/tts_validation
voices:
  defaults:
    vi:
      id: vi_VN-vais1000-medium
      language: vi_VN
      quality: medium
      model_path: models/tts/piper/vi/vi_VN/vais1000/medium/vi_VN-vais1000-medium.onnx
      config_path: models/tts/piper/vi/vi_VN/vais1000/medium/vi_VN-vais1000-medium.onnx.json
      expected_sample_rate_hz: 22050
      prompt: "Xin chao. He thong ho tro dieu huong da san sang."
    en:
      id: en_US-lessac-medium
      language: en_US
      quality: medium
      model_path: models/tts/piper/en/en_US/lessac/medium/en_US-lessac-medium.onnx
      config_path: models/tts/piper/en/en_US/lessac/medium/en_US-lessac-medium.onnx.json
      expected_sample_rate_hz: 22050
      prompt: "Navigation assistance is ready."
  fallbacks:
    vi:
      id: vi_VN-vivos-x_low
      model_path: models/tts/piper/vi/vi_VN/vivos/x_low/vi_VN-vivos-x_low.onnx
      config_path: models/tts/piper/vi/vi_VN/vivos/x_low/vi_VN-vivos-x_low.onnx.json
    en:
      id: en_US-amy-medium
      model_path: models/tts/piper/en/en_US/amy/medium/en_US-amy-medium.onnx
      config_path: models/tts/piper/en/en_US/amy/medium/en_US-amy-medium.onnx.json
validation:
  dry_run_default: true
  require_files:
    - .onnx
    - .onnx.json
  checks:
    - config_json_readable
    - wav_readable
    - duration_positive
    - mono_pcm
    - sample_rate_matches_config
