name: yolov8n
role: object_detection_accessibility
model:
  weights: yolov8n.pt
dataset:
  config: configs/datasets/object_detection_accessibility.yaml
  root: data/processed/object_detection_accessibility_merged
  classes: data/processed/object_detection_accessibility_merged/classes.txt
  data_yaml: data/processed/object_detection_accessibility_merged/yolov8n_data.yaml
training:
  imgsz: 640
  epochs: 100
  batch: 16
  lr0: 0.01
  mosaic: 1.0
  mixup: 0.1
  multi_scale: true
  workers: 4
  patience: 20
  fraction: 1.0
  exist_ok: false
  device: xpu
pilot:
  epochs: 5
  batch: 16
  device: xpu
  name: pilot_5e
  fraction: 0.005
  workers: 0
  patience: 2
  multi_scale: false
  exist_ok: true
  summary_json: reports/yolov8n/pilot_5e/train_summary.json
  eval_summary_json: reports/yolov8n/pilot_5e/eval_summary.json
  errors_csv: reports/yolov8n/pilot_5e/errors.csv
output:
  run_dir: runs/yolov8n
  report_dir: reports/yolov8n
  checkpoint_dir: models/vision/yolov8n
