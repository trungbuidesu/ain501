[project]
name = "ain501"
version = "0.1.0"
description = "AIN501 Project"
authors = [
    {name = "Bùi Đức Trung", email = "bdtrung29.1@gmail.com"}
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "requests>=2.31.0",
    "tqdm>=4.65.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "torchaudio>=2.0.0",
    "ultralytics>=8.0.0",
    "onnx>=1.14.0",
    "onnxruntime>=1.15.0",
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
    "paddleocr>=2.6.0",
    "mediapipe>=0.10.0",
    "faiss-cpu>=1.7.4",
    "sentence-transformers>=2.2.2",
    "PySide6>=6.5.0",
    "dxcam>=0.1.1",
    "mss>=9.0.1",
    "tensorboard>=2.13.0",
    "wandb>=0.15.0",
    "jupyter>=1.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "scikit-learn>=1.3.0",
    "pycocotools>=2.0.7",
    "albumentations>=1.3.0",
]
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
    "black>=23.9.0",
    "mypy>=1.5.0",
]
tts = [
    "piper-tts>=1.2.0",
]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "C4", "UP"]
ignore = ["UP009"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
